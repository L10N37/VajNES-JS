name: Emulator accuracy regression
on:
  push:
    branches: [accuracycoin-development]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core regression tests
        run: node --test tests/*.test.cjs
      - name: Build audio source and check native/WASM parity
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          CLANGXX=clang++ sh audio/build.sh
          node --test tests/audio.test.cjs
          g++ -O3 -ffp-contract=off tests/native-audio.cpp -o /tmp/vajnes-native-audio
          node tests/native-wasm-parity.cjs /tmp/vajnes-native-audio
      - name: Fetch pinned upstream AccuracyCoin
        run: |
          git init "$RUNNER_TEMP/accuracycoin"
          git -C "$RUNNER_TEMP/accuracycoin" remote add origin https://github.com/100thCoin/AccuracyCoin.git
          git -C "$RUNNER_TEMP/accuracycoin" fetch --depth 1 origin 673ef550db296136d52229961e7d39366116882a
          git -C "$RUNNER_TEMP/accuracycoin" checkout --detach FETCH_HEAD
      - name: Fetch pinned MMC3 and video tests
        run: |
          git init "$RUNNER_TEMP/nes-test-roms"
          git -C "$RUNNER_TEMP/nes-test-roms" remote add origin https://github.com/christopherpow/nes-test-roms.git
          git -C "$RUNNER_TEMP/nes-test-roms" fetch --depth 1 origin 95d8f621ae55cee0d09b91519a8989ae0e64753b
          git -C "$RUNNER_TEMP/nes-test-roms" checkout --detach FETCH_HEAD
      - name: MMC3 and PPU video regression gate
        run: node tests/blargg.cjs "$RUNNER_TEMP/nes-test-roms" blargg-report.json
      - name: AccuracyCoin 144/144 regression gate
        run: node tests/accuracycoin.cjs "$RUNNER_TEMP/accuracycoin/AccuracyCoin.nes" accuracy-report.json tests/results/current.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracycoin-results
          path: |
            accuracy-report.json
            blargg-report.json

  blargg-expanded:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [cpu, ppu, apu, extra, reset, legacy, legacycpu, aggregate, edge, legacyaggregate, nestest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned nes-test-roms
        run: |
          git init "$RUNNER_TEMP/nes-test-roms"
          git -C "$RUNNER_TEMP/nes-test-roms" remote add origin https://github.com/christopherpow/nes-test-roms.git
          git -C "$RUNNER_TEMP/nes-test-roms" fetch --depth 1 origin 95d8f621ae55cee0d09b91519a8989ae0e64753b
          git -C "$RUNNER_TEMP/nes-test-roms" checkout --detach FETCH_HEAD
      - name: Expanded Blargg regression gate (${{ matrix.shard }})
        env:
          BLARGG_SHARD: ${{ matrix.shard }}
        run: node tests/blargg-expanded.cjs "$RUNNER_TEMP/nes-test-roms" "blargg-expanded-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blargg-expanded-${{ matrix.shard }}
          path: blargg-expanded-${{ matrix.shard }}.json

  singlestep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: ss0
            opcodes: "00 08 0E 16 1E 25 2A 30 38 40 48 4D 55 5D 65 6A 70 78 81 88 8E 95 9A A2 A8 AD B4 B9 BE C5 CA D0 D8 E0 E6 EC F1 F9"
          - shard: ss1
            opcodes: "01 09 10 18 20 26 2C 31 39 41 49 4E 56 5E 66 6C 71 79 84 8A 90 96 9D A4 A9 AE B5 BA C0 C6 CC D1 D9 E1 E8 ED F5 FD"
          - shard: ss2
            opcodes: "05 0A 11 19 21 28 2D 35 3D 45 4A 50 58 60 68 6D 75 7D 85 8C 91 98 A0 A5 AA B0 B6 BC C1 C8 CD D5 DD E4 E9 EE F6 FE"
          - shard: ss3
            opcodes: "06 0D 15 1D 24 29 2E 36 3E 46 4C 51 59 61 69 6E 76 7E 86 8D 94 99 A1 A6 AC B1 B8 BD C4 C9 CE D6 DE E5 EA F0 F8"
          - shard: u0
            opcodes: "03 0C 17 1F 2F 3A 43 4F 5A 63 6F 7A 80 89 97 9F AF BF CB D7 DF EB F7 FF"
          - shard: u1
            opcodes: "04 0F 1A 23 33 3B 44 53 5B 64 73 7B 82 8B 9B A3 B3 C2 CF DA E2 EF FA"
          - shard: u2
            opcodes: "07 13 1B 27 34 3C 47 54 5C 67 74 7C 83 8F 9C A7 B7 C3 D3 DB E3 F3 FB"
          - shard: u3
            opcodes: "0B 14 1C 2B 37 3F 4B 57 5F 6B 77 7F 87 93 9E AB BB C7 D4 DC E7 F4 FC"
          - shard: jam
            opcodes: "02 12 22 32 42 52 62 72 92 B2 D2 F2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned NES 6502 SingleStepTests
        env:
          SINGLESTEP_OPCODES: ${{ matrix.opcodes }}
        run: |
          mkdir -p "$RUNNER_TEMP/nes6502-v1"
          base="https://raw.githubusercontent.com/SingleStepTests/ProcessorTests/bb11756436da8fd16cce86aef63dc6725f48836f/nes6502/v1"
          for op in $SINGLESTEP_OPCODES; do
            op=$(echo "$op" | tr '[:upper:]' '[:lower:]')
            curl --fail --location --silent --show-error "$base/$op.json" -o "$RUNNER_TEMP/nes6502-v1/$op.json"
          done
      - name: NES 6502 single-step regression gate
        env:
          SINGLESTEP_OPCODES: ${{ matrix.opcodes }}
        run: node tests/singlestep.cjs "$RUNNER_TEMP/nes6502-v1" "singlestep-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: singlestep-${{ matrix.shard }}
          path: singlestep-${{ matrix.shard }}.json

